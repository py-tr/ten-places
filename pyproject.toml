[project]
name = "tenplaces"
version = "0.1.0"
description = "Bimanual SO-101 dinner-table setting in MuJoCo, optimised with OpenVINO on Intel CPUs"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mujoco>=3.3",
  "numpy",
  "openvino>=2026.3",
  "nncf>=3.0",
  "imageio",
  "imageio-ffmpeg",
  "pyyaml",
]

[tool.setuptools]
packages = ["tenplaces", "tenplaces.oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
